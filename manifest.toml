#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "pureblog"
name = "PureBlog"
description.en = "Blogging platform, designed for personal use"
description.fr = "Plateforme de blog, conçue pour un usage personnel"

version = "3.8.12~ynh1"

maintainers = ["eric_G"]

[upstream]
license = "LicenseRef-Pure-Blog-1"
license_url = "https://github.com/kevquirk/pureblog/blob/main/LICENSE.md"
website = "https://pureblog.org/"
admindoc = "https://pureblog.org/docs"
code = "https://github.com/kevquirk/pureblog"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"
    
    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    [resources.sources.main]
    url = "https://github.com/kevquirk/pureblog/archive/refs/tags/v3.8.12.tar.gz"
    sha256 = "eb22a648eabf411438f2bc0532599275f4b0069a2b583177f17f3754f8926dd3"

    autoupdate.strategy = "latest_github_release"

    [resources.system_user]

    [resources.install_dir]
    group = "www-data:r-x"
    
    [resources.permissions]
    main.url = "/"

    [resources.apt]
    packages = "php8.5-mbstring, php8.5-xml, php8.5-curl, php8.5-zip"
